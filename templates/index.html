<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Services | Users</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-shell">
    <header class="app-header">
        <a class="brand" href="/" aria-label="CI/CD Services home">
            <span class="brand-mark">C</span> CI/CD SERVICES
        </a>
        <nav class="app-nav" aria-label="Main navigation">
            <a class="nav-link nav-link-active" href="/client">Client</a>
            <a class="nav-link" href="/admin">Admin</a>
        </nav>
        <span class="header-note">A calm space for your delivery team</span>
    </header>

    <main class="app-main">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Team directory</p>
                <h1 id="dashboardTitle">Welcome to CI/CD services</h1>
                <p class="page-description">Keep your people and their roles close at hand.</p>
            </div>
            <div>
            <span id="userCount" class="count-badge">0 users</span>
            </div>
        </div>

        <section class="panel" aria-labelledby="directory-title">
            <div class="panel-header page-heading">
                <div>
                    <p class="eyebrow">People</p>
                    <h2 id="directory-title">Team directory</h2>
                </div>
                <button id="addUserBtn" class="button button-primary">+ Add user</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Designation</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="userModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <h2>Add new user</h2>
            <p class="modal-description">Add a teammate to the shared directory.</p>
            <form id="userForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" required>
                    </div>
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" required>
                    </div>
                    <div class="field">
                        <label for="designation">Designation</label>
                        <input id="designation" name="designation" type="text" required>
                    </div>
                    <div class="field full-width">
                        <label for="hobbies">Hobbies</label>
                        <input id="hobbies" name="hobbies" type="text" placeholder="e.g. Reading, Traveling">
                    </div>
                </div>
                <div class="error-message" id="formError"></div>
                <div class="actions">
                    <button type="button" class="button button-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="button button-primary">Save user</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const userCount = document.getElementById('userCount');
        const userTableBody = document.getElementById('userTableBody');
        const addUserBtn = document.getElementById('addUserBtn');
        const userModal = document.getElementById('userModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const userForm = document.getElementById('userForm');
        const formError = document.getElementById('formError');
        const expectedUserType = window.location.pathname.startsWith('/admin') ? 'admin' : 'client';
        const signedInUserType = sessionStorage.getItem('userType');

        if (signedInUserType !== expectedUserType) {
            window.location.replace('/login');
        }

        document.getElementById('dashboardTitle').textContent = `${expectedUserType === 'admin' ? 'Admin' : 'Client'} dashboard`;
        document.querySelector('.header-note').textContent = `Signed in as ${sessionStorage.getItem('username') || 'team member'}`;

        function updateUserCount(users) {
            userCount.textContent = `${users.length} user${users.length === 1 ? '' : 's'}`;
        }

        function openModal() {
            userModal.classList.add('visible');
            userModal.setAttribute('aria-hidden', 'false');
            document.getElementById('username').focus();
        }

        function closeModal() {
            userModal.classList.remove('visible');
            userModal.setAttribute('aria-hidden', 'true');
            userForm.reset();
            formError.textContent = '';
        }

        async function getUserData() {
            try {
                const response = await fetch('/api/users');
                const result = await response.json();

                if (!result.status) {
                    throw new Error(result.msg || 'No user data found.');
                }

                const users = result.data || [];
                updateUserCount(users);

                if (!users.length) {
                    userTableBody.innerHTML = `
                        <tr>
                            <td colspan="3">No users found.</td>
                        </tr>
                    `;
                    return;
                }

                userTableBody.innerHTML = users.map((user) => `
                    <tr data-user-id="${user.userId || user.user_id}" data-username="${user.username}">
                        <td>${user.name || `${user.firstName || ''} ${user.lastName || ''}`}</td>
                        <td>${user.designation || user.userType || user.user_type}</td>
                        <td>
                            <button type="button" class="button button-danger" data-username="${user.username}">Remove</button>
                        </td>
                    </tr>
                `).join('');

                userTableBody.querySelectorAll('tr').forEach((row) => {
                    row.addEventListener('click', (event) => {
                        if (event.target.closest('.button-danger')) {
                            return;
                        }

                        const username = row.dataset.username;
                        window.location.href = `/${expectedUserType}/user-details?username=${encodeURIComponent(username)}`;
                    });
                });

                userTableBody.querySelectorAll('.button-danger').forEach((button) => {
                    button.addEventListener('click', async (event) => {
                        event.stopPropagation();
                        const username = button.dataset.username;

                        const confirmed = window.confirm(`Are you sure you want to remove ${username}?`);
                        if (!confirmed) {
                            return;
                        }

                        try {
                            const response = await fetch(`/api/users/${encodeURIComponent(button.closest('tr').dataset.userId)}`, {
                                method: 'DELETE'
                            });
                            const result = await response.json();

                            if (!result.status) {
                                throw new Error(result.msg || 'Unable to remove user.');
                            }

                            await getUserData();
                        } catch (error) {
                            console.error('Error removing user:', error);
                            alert(error.message || 'Unable to remove user.');
                        }
                    });
                });
            } catch (error) {
                console.error('Error:', error);
                userTableBody.innerHTML = `
                    <tr>
                        <td colspan="3">Unable to load user data.</td>
                    </tr>
                `;
                updateUserCount([]);
            }
        }

        addUserBtn.addEventListener('click', openModal);
        cancelBtn.addEventListener('click', closeModal);
        userModal.addEventListener('click', (event) => {
            if (event.target === userModal) {
                closeModal();
            }
        });

        userForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formError.textContent = '';

            const formData = new FormData(userForm);
            const hobbies = (formData.get('hobbies') || '')
                .split(',')
                .map((hobby) => hobby.trim())
                .filter(Boolean);

            const payload = {
                clientId: sessionStorage.getItem('clientId'),
                userType: expectedUserType === 'admin' ? 'ADMIN' : 'WAITER',
                username: formData.get('username'),
                password: formData.get('password'),
                firstName: formData.get('name'),
                lastName: '',
                age: null
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok || !result.status) {
                    throw new Error(result.msg || 'Unable to add user.');
                }

                closeModal();
                await getUserData();
            } catch (error) {
                formError.textContent = error.message || 'Unable to add user.';
            }
        });

        getUserData();
    </script>
</body>
</html>
