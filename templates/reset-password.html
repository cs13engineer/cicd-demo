<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Restaurant Ops</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-shell auth-shell">
    <main class="auth-layout auth-layout-compact">
        <section class="auth-intro">
            <a class="brand" href="/client"><span class="brand-mark">R</span> RESTAURANT OPS</a>
            <div class="auth-intro-copy"><p class="eyebrow">Account security</p><h1>Choose a private password.</h1><p class="page-description">Update the default password assigned to your account.</p></div>
        </section>
        <section class="auth-card" aria-labelledby="reset-title">
            <p class="eyebrow">Password reset</p><h2 id="reset-title">Update password</h2>
            <form id="resetForm">
                <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" required></div>
                <div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="8" required></div>
                <p id="resetError" class="error-message" role="alert"></p>
                <button class="button button-primary button-wide" type="submit">Update password</button>
            </form>
            <p class="auth-footer"><a href="/client">Return to dashboard</a></p>
        </section>
    </main>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const error = document.getElementById('resetError');
            error.textContent = '';
            const response = await fetch('/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ currentPassword: form.currentPassword.value, newPassword: form.newPassword.value }) });
            const result = await response.json();
            if (!response.ok || !result.status) { error.textContent = result.msg || 'Unable to update password.'; return; }
            window.location.href = '/client';
        });
    </script>
</body>
</html>
