<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CI/CD Services</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-shell auth-shell">
    <main class="auth-layout auth-layout-compact">
        <section class="auth-intro">
            <a class="brand" href="/" aria-label="CI/CD Services home">
                <span class="brand-mark">C</span> CI/CD SERVICES
            </a>
            <div class="auth-intro-copy">
                <p class="eyebrow">Join the workspace</p>
                <h1>Set up your team access.</h1>
                <p class="page-description">Create an account, then sign in to the dashboard that matches your role.</p>
            </div>
        </section>

        <section class="auth-card" aria-labelledby="register-title">
            <p class="eyebrow">Registration</p>
            <h2 id="register-title">Register your restaurant</h2>
            <p class="modal-description">Create the restaurant workspace and its first administrator together.</p>
            <form id="registrationForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="clientName">Restaurant name</label>
                        <input id="clientName" name="clientName" type="text" required>
                    </div>
                    <div class="field">
                        <label for="contactNumber">Contact number</label>
                        <input id="contactNumber" name="contactNumber" type="tel">
                    </div>
                    <div class="field">
                        <label for="emailId">Email address</label>
                        <input id="emailId" name="emailId" type="email" required>
                    </div>
                    <div class="field">
                        <label for="username">Admin username</label>
                        <input id="username" name="username" type="text" required>
                    </div>
                    <div class="field">
                        <label for="password">Admin password</label>
                        <input id="password" name="password" type="password" minlength="8" required>
                    </div>
                    <div class="field">
                        <label for="firstName">Admin first name</label>
                        <input id="firstName" name="firstName" type="text" required>
                    </div>
                    <div class="field full-width">
                        <label for="lastName">Admin last name</label>
                        <input id="lastName" name="lastName" type="text" required>
                    </div>
                </div>
                <p id="registrationError" class="error-message" role="alert"></p>
                <button class="button button-primary button-wide" type="submit">Create account</button>
            </form>
            <p class="auth-footer">Already registered? <a href="/login">Sign in</a></p>
        </section>
    </main>
    <script>
        const form = document.getElementById('registrationForm');
        const errorMessage = document.getElementById('registrationError');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.textContent = '';
            const formData = new FormData(form);

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clientName: formData.get('clientName'),
                        contactNumber: formData.get('contactNumber'),
                        emailId: formData.get('emailId'),
                        username: formData.get('username'),
                        password: formData.get('password'),
                        firstName: formData.get('firstName'),
                        lastName: formData.get('lastName')
                    })
                });
                const result = await response.json();
                if (!response.ok || !result.status) throw new Error(result.msg || 'Unable to register.');
                sessionStorage.setItem('clientId', result.data.clientId);
                window.location.href = '/login';
            } catch (error) {
                errorMessage.textContent = error.message;
            }
        });
    </script>
</body>
</html>
