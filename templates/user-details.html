<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details | CI/CD Services</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-shell">
    <header class="app-header">
        <a class="brand" href="/" aria-label="CI/CD Services home">
            <span class="brand-mark">C</span> CI/CD SERVICES
        </a>
        <nav class="app-nav" aria-label="Main navigation">
            <a class="nav-link nav-link-active" href="/client">Client</a>
            <a class="nav-link" href="/admin">Admin</a>
        </nav>
        <span class="header-note">Team member profile</span>
    </header>

    <main class="app-main">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Directory</p>
                <h1>User details</h1>
                <p class="page-description">A closer look at this team member.</p>
            </div>
        </div>
        <section id="userDetails" class="detail-card" aria-live="polite"></section>
    </main>

    <script>
        function getUserFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('username');
        }

        async function loadUserDetails() {
            const username = getUserFromQuery();
            const container = document.getElementById('userDetails');

            if (!username) {
                container.innerHTML = '<p>No user selected.</p>';
                return;
            }

            try {
                const response = await fetch('/api/users');
                const result = await response.json();

                if (!result.status) {
                    throw new Error(result.msg || 'No user data found.');
                }

                const user = (result.data || []).find((item) => item.username === username);

                if (!user) {
                    container.innerHTML = '<p>User not found.</p>';
                    return;
                }

                container.innerHTML = `
                    <div class="detail-row"><span class="detail-label">Username</span><span>${user.username}</span></div>
                    <div class="detail-row"><span class="detail-label">Name</span><span>${user.name || `${user.firstName || ''} ${user.lastName || ''}`}</span></div>
                    <div class="detail-row"><span class="detail-label">Role</span><span>${user.userType || user.user_type}</span></div>
                `;
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = '<p>Unable to load user details.</p>';
            }
        }

        loadUserDetails();
    </script>
</body>
</html>
