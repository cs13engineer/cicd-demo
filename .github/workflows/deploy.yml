name: Deploy Application

#this the event of action.
on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
            docker compose build

      - name: Deploy Containers
        run: |
            docker compose up -d
